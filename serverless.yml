service: shui
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource: !GetAtt UsersTable.Arn

functions:
  register:
    handler: src/handlers/register.handler
    environment:
      USERS_TABLE_NAME: !Ref UsersTable
    events:
      - httpApi:
          path: /auth/register
          method: post
  login:
    handler: src/handlers/login.handler
    role: !GetAtt LoginExecutionRole.Arn
    environment:
      USERS_TABLE_NAME: !Ref UsersTable
      JWT_SECRET_PARAMETER: /shui/${sls:stage}/jwt-secret
    events:
      - httpApi:
          path: /auth/login
          method: post
  createPost:
    handler: src/handlers/create-post.handler
    role: !GetAtt CreatePostExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
      JWT_SECRET_PARAMETER: /shui/${sls:stage}/jwt-secret
    events:
      - httpApi:
          path: /posts
          method: post
  listPosts:
    handler: src/handlers/list-posts.handler
    role: !GetAtt ListPostsExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
    events:
      - httpApi:
          path: /posts
          method: get
  getPost:
    handler: src/handlers/get-post.handler
    role: !GetAtt GetPostExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
    events:
      - httpApi:
          path: /posts/{postId}
          method: get
  getComments:
    handler: src/handlers/get-comments.handler
    role: !GetAtt GetCommentsExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
      COMMENTS_TABLE_NAME: !Ref CommentsTable
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: get
  createComment:
    handler: src/handlers/create-comment.handler
    role: !GetAtt CreateCommentExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
      COMMENTS_TABLE_NAME: !Ref CommentsTable
      JWT_SECRET_PARAMETER: /shui/${sls:stage}/jwt-secret
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: post
  updatePost:
    handler: src/handlers/update-post.handler
    role: !GetAtt UpdatePostExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
      JWT_SECRET_PARAMETER: /shui/${sls:stage}/jwt-secret
    events:
      - httpApi:
          path: /posts/{postId}
          method: put
  deletePost:
    handler: src/handlers/delete-post.handler
    role: !GetAtt DeletePostExecutionRole.Arn
    environment:
      POSTS_TABLE_NAME: !Ref PostsTable
      JWT_SECRET_PARAMETER: /shui/${sls:stage}/jwt-secret
    events:
      - httpApi:
          path: /posts/{postId}
          method: delete

resources:
  Resources:
    DeletePostExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: delete-post-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:DeleteItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - ssm
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - parameter/shui/${sls:stage}/jwt-secret
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-deletePost
                        - "*"
    UpdatePostExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: update-post-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - ssm
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - parameter/shui/${sls:stage}/jwt-secret
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-updatePost
                        - "*"
    GetPostExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: get-post-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-getPost
                        - "*"
    GetCommentsExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: get-comments-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource: !GetAtt CommentsTable.Arn
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-getComments
                        - "*"
    CreateCommentExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: create-comment-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource: !GetAtt CommentsTable.Arn
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - ssm
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - parameter/shui/${sls:stage}/jwt-secret
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-createComment
                        - "*"
    ListPostsExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: list-posts-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - Fn::Join:
                        - ""
                        - - !GetAtt PostsTable.Arn
                          - /index/PostsFeedIndex
                    - Fn::Join:
                        - ""
                        - - !GetAtt PostsTable.Arn
                          - /index/PostsByUsernameIndex
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-listPosts
                        - "*"
    CreatePostExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: create-post-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource: !GetAtt PostsTable.Arn
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - ssm
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - parameter/shui/${sls:stage}/jwt-secret
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-createPost
                        - "*"
    LoginExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: login-access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt UsersTable.Arn
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - ssm
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - parameter/shui/${sls:stage}/jwt-secret
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Join:
                      - ":"
                      - - arn
                        - !Ref AWS::Partition
                        - logs
                        - !Ref AWS::Region
                        - !Ref AWS::AccountId
                        - log-group
                        - /aws/lambda/${self:service}-${sls:stage}-login
                        - "*"
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH
    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: feedKey
            AttributeType: S
          - AttributeName: feedSortKey
            AttributeType: S
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PostsFeedIndex
            KeySchema:
              - AttributeName: feedKey
                KeyType: HASH
              - AttributeName: feedSortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: PostsByUsernameIndex
            KeySchema:
              - AttributeName: username
                KeyType: HASH
              - AttributeName: feedSortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: postId
            AttributeType: S
          - AttributeName: commentSortKey
            AttributeType: S
        KeySchema:
          - AttributeName: postId
            KeyType: HASH
          - AttributeName: commentSortKey
            KeyType: RANGE
