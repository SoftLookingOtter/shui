service: shui
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource: !GetAtt UsersTable.Arn

functions:
  register:
    handler: src/handlers/register.handler
    environment:
      USERS_TABLE_NAME: !Ref UsersTable
    events:
      - httpApi:
          path: /auth/register
          method: post

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH
